name: Build API Proxy

on:
  push:
    branches:
      - main
    paths:
      - "packages/api-proxy/**"
      - ".github/workflows/api-proxy-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get short SHA
        id: sha
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: ./packages/api-proxy
          file: ./packages/api-proxy/Dockerfile
          tags: |
            ghcr.io/sushiibot/api-proxy:latest
            ghcr.io/sushiibot/api-proxy:${{ steps.sha.outputs.sha_short }}
          cache-from: type=registry,ref=ghcr.io/sushiibot/api-proxy:buildcache
          cache-to: type=registry,ref=ghcr.io/sushiibot/api-proxy:buildcache,mode=max

      - name: Output image info
        run: |
          echo "Built and pushed image: ghcr.io/sushiibot/api-proxy:${STEPS_SHA_OUTPUTS_SHA_SHORT}"
          echo "Also tagged as: ghcr.io/sushiibot/api-proxy:latest"
        env:
          STEPS_SHA_OUTPUTS_SHA_SHORT: ${{ steps.sha.outputs.sha_short }}

  docker-cleanup:
    needs: docker-build
    uses: sushiibot/sushii-workflows/.github/workflows/docker-cleanup.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/api-proxy
    permissions:
      packages: write
