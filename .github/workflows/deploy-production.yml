name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Never cancel — the approval gate only covers the start of the deploy job,
  # and a run past that point is mid blue-green cutover. A newer run must
  # queue behind it, not cancel it mid-deploy.
  cancel-in-progress: false

jobs:
  pre-deploy-summary:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Get short SHA
        id: sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Checkout sushii-ansible
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sushiibot/sushii-ansible
          token: ${{ secrets.ANSIBLE_REPO_TOKEN }}
          path: sushii-ansible
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install script dependencies
        working-directory: sushii-ansible/scripts
        run: bun install --frozen-lockfile

      - name: Pre-deploy summary
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_SHA_OUTPUTS_SHA_SHORT: ${{ steps.sha.outputs.sha_short }}
        run: bun run sushii-ansible/scripts/deploy-sushii-bot.ts --summary --sha ${STEPS_SHA_OUTPUTS_SHA_SHORT}

  deploy:
    needs: pre-deploy-summary
    uses: sushiibot/sushii-workflows/.github/workflows/deploy-blue-green.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_version: ${{ needs.pre-deploy-summary.outputs.sha_short }}
      environment: production
      dry_run: false
    secrets: inherit
