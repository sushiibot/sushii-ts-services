name: Build and Deploy sushii-mcp

on:
  push:
    branches:
      - main
    paths:
      - "packages/sushii-mcp/**"
      - "packages/sushii-worker/src/infrastructure/database/schema.ts"
      - ".github/workflows/sushii-mcp-docker.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          context: .
          file: ./packages/sushii-mcp/Dockerfile
          tags: |
            ghcr.io/sushiibot/sushii-mcp:latest
            ghcr.io/sushiibot/sushii-mcp:${{ steps.sha.outputs.sha_short }}
          cache-from: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/sushiibot/sushii-mcp:buildcache,mode=max

  deploy:
    needs: docker-build
    uses: sushiibot/sushii-workflows/.github/workflows/deploy.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      service: sushii-bot/sushii-mcp
      image_version: ${{ needs.docker-build.outputs.sha_short }}
      host: sushii-bot
      environment: sushii-mcp
    secrets: inherit

  docker-cleanup:
    needs: docker-build
    uses: sushiibot/sushii-workflows/.github/workflows/docker-cleanup.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-mcp
    permissions:
      packages: write
